{# Per-question discussion partial (lazy load).
   Required: question_no
#}
<details class="qcomments" data-qno="{{ question_no }}" style="margin-top:12px;border:1px solid var(--border);border-radius:8px;background:#fafbfc;">
  <summary style="cursor:pointer;padding:10px 14px;font-weight:600;font-size:0.92rem;color:#1e3a8a;display:flex;align-items:center;gap:8px;">
    <i class="fas fa-comments"></i>
    <span>Discussion · Share your thoughts</span>
    <span class="qcomments-count" style="margin-left:auto;font-size:0.78rem;color:var(--text-muted);font-weight:400"></span>
  </summary>
  <div class="qcomments-body" style="padding:12px 14px;border-top:1px solid var(--border);">
    <div class="qcomments-loading" style="color:var(--text-muted);font-size:0.85rem;">Loading…</div>
  </div>
</details>

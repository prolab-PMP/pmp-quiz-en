{% extends "base.html" %}
{% block title %}{{ code }} Error{% endblock %}
{% block content %}
<div class="card" style="text-align:center;padding:60px 24px;">
    <div style="font-size:4rem;color:var(--text-muted);margin-bottom:16px;">{{ code }}</div>
    <h2 style="margin-bottom:12px;">{{ message }}</h2>
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="fas fa-home"></i> Back to dashboard
    </a>
    {% else %}
    <a href="{{ url_for('free_mode') }}" class="btn btn-primary">
        <i class="fas fa-play"></i> Try 50 questions free
    </a>
    <a href="{{ url_for('blog_index') }}" style="display:block;margin-top:14px;font-size:0.9rem;color:#64748b;text-decoration:none;">Or read the PMP study guides</a>
    {% endif %}
</div>
{% endblock %}
